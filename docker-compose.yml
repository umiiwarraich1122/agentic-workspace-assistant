version: '3.8'

services:
  # The FastAPI Backend Server
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mr-jarvis-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    # Overrides CMD in Dockerfile if you want hot-reload in development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  # The LiveKit Voice Agent Worker
  backend-livekit:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mr-jarvis-livekit
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    # Override the default command to start the LiveKit worker instead of FastAPI
    command: python -m livekit_agent.agent start
    restart: always

  # -- WhatsApp Gateway (Evolution API) -------------------------
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=jarvis_secure_key_123
    restart: always

volumes:
  evolution_instances:
