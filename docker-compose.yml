version: '3.8'

services:
  # The FastAPI Backend Server
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mr-jarvis-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    # Overrides CMD in Dockerfile if you want hot-reload in development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  # The LiveKit Voice Agent Worker
  backend-livekit:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mr-jarvis-livekit
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    # Override the default command to start the LiveKit worker instead of FastAPI
    command: python -m livekit_agent.agent start
    restart: always

  # -- Database for Evolution API -------------------------
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    environment:
      - POSTGRES_USER=evo_user
      - POSTGRES_PASSWORD=evo_pass
      - POSTGRES_DB=evolution_db
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    restart: always

  # -- WhatsApp Gateway (Evolution API) -------------------------
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=jarvis_secure_key_123
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evo_user:evo_pass@evolution-postgres:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=false
    depends_on:
      - evolution-postgres
    restart: always

volumes:
  evolution_instances:
