# -- HTTP ? HTTPS redirect --------------------------------------
server {
    listen 80;
    server_name mr-jarvis.tech www.mr-jarvis.tech;

    # Required for Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -- HTTPS main server ------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name mr-jarvis.tech www.mr-jarvis.tech;

    # SSL certificates (issued by Certbot/Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/mr-jarvis.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mr-jarvis.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # -- Backend API routes -------------------------------------
    # Route all API, auth, and service calls to FastAPI
    location ~ ^/(api|auth|chat|emails|calendar|todos|health)(/|$) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Critical: disable buffering for SSE streaming (chat endpoint)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -- Frontend React App -------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
