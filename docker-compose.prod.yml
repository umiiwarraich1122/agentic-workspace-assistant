version: '3.8'

services:
  # -- FastAPI Backend API --------------------------------------
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mr-jarvis-api
    # We no longer expose port 8000 to the host! Caddy proxies internally.
    env_file:
      - ./backend/.env
    volumes:
      - jarvis_tokens:/app/tokens_db.json
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -- LiveKit Voice Agent Worker -------------------------------
  backend-livekit:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mr-jarvis-livekit
    env_file:
      - ./backend/.env
    volumes:
      - jarvis_tokens:/app/tokens_db.json
    command: python -m livekit_agent.agent start
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - backend-api

  # -- Caddy (Frontend + Reverse Proxy) -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://mr-jarvis.tech
        VITE_LIVEKIT_URL: wss://mr-jarvis-jj6lb16p.livekit.cloud
    container_name: mr-jarvis-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persist Caddy's certificates to avoid hitting Let's Encrypt rate limits
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - backend-api

  # -- WhatsApp Gateway (Evolution API) -------------------------
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=jarvis_secure_key_123
    restart: always

volumes:
  jarvis_tokens:
  caddy_data:
  caddy_config:
  evolution_instances:
